<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Palavras - IA e Programação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .score-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .score {
            font-size: 1.2em;
            color: #333;
            font-weight: bold;
        }

        .score span {
            color: #667eea;
        }

        .level-info {
            text-align: center;
            color: #666;
        }

        .game-content {
            margin-bottom: 30px;
        }

        .phrase-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .phrase-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .phrase {
            font-size: 1.3em;
            line-height: 2;
            color: #333;
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .word-blank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            height: 45px;
            background: white;
            border: 2px dashed #667eea;
            border-radius: 8px;
            cursor: grab;
            transition: all 0.3s ease;
            position: relative;
        }

        .word-blank:hover {
            background: #f0f0ff;
            border-color: #764ba2;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .word-blank.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .word-blank.filled {
            background: #667eea;
            color: white;
            border: 2px solid #667eea;
            font-weight: bold;
            cursor: default;
        }

        .word-blank.filled:hover {
            background: #667eea;
            border-color: #667eea;
        }

        .word-bank-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            min-height: 80px;
            align-content: flex-start;
        }

        .draggable-word {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: grab;
            user-select: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .draggable-word:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .draggable-word:active {
            cursor: grabbing;
            transform: scale(0.98);
        }

        .draggable-word.used {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-check {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-check:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .feedback {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        .feedback.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .feedback.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .drop-zone-active {
            background: #e8eeff !important;
            border-color: #667eea !important;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3) !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .phrase {
                font-size: 1em;
            }

            .draggable-word {
                padding: 10px 16px;
                font-size: 0.9em;
            }

            .word-blank {
                min-width: 70px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 IA no Mundo da Programação</h1>
            <p>Complete as frases sobre Inteligência Artificial e desenvolvimento de software</p>
        </div>

        <div class="score-section">
            <div class="score">Acertos: <span id="correct">0</span> / <span id="total">8</span></div>
            <div class="level-info">Nível: <span id="level">1</span></div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div class="game-content" id="gameContent"></div>

        <div class="buttons">
            <button class="btn-check" onclick="checkAnswers()">✓ Verificar Respostas</button>
            <button class="btn-reset" onclick="resetGame()">↻ Começar de Novo</button>
        </div>

        <div class="feedback" id="feedback"></div>
    </div>

    <script>
        const phrases = [
            {
                phrase: "Assistentes de IA como GitHub Copilot podem gerar automaticamente ",
                blanks: ["código"],
                options: ["código", "testes", "erros", "bugs"]
            },
            {
                phrase: "ChatGPT e GPT são exemplos de modelos baseados em ",
                blanks: ["linguagem"],
                options: ["linguagem", "dados", "loops", "variáveis"]
            },
            {
                phrase: "A IA utiliza redes neurais que são inspiradas no funcionamento do ",
                blanks: ["cérebro"],
                options: ["cérebro", "computador", "processador", "servidor"]
            },
            {
                phrase: "Um programador pode usar IA para acelerar o desenvolvimento e corrigir ",
                blanks: ["bugs"],
                options: ["bugs", "códigos", "bancos", "arquivos"]
            },
            {
                phrase: "Machine Learning é um ramo da IA que permite aos computadores aprender com ",
                blanks: ["dados"],
                options: ["dados", "erros", "sintaxe", "memória"]
            },
            {
                phrase: "Ferramentas de IA conseguem analisar e otimizar a complexidade de ",
                blanks: ["algoritmos"],
                options: ["algoritmos", "arquivos", "nomes", "comentários"]
            },
            {
                phrase: "A IA pode usar análise de padrões para detectar vulnerabilidades de segurança em ",
                blanks: ["aplicações"],
                options: ["aplicações", "dados", "usuários", "servidores"]
            },
            {
                phrase: "Muitos IDEs modernos agora integram assistentes de IA para autocompletar código e sugerir ",
                blanks: ["soluções"],
                options: ["soluções", "erros", "linhas", "funções"]
            }
        ];

        let currentPhrase = 0;
        let correctAnswers = 0;
        let filledBlanks = {};
        let usedWords = new Set();

        function loadPhrase() {
            const phrase = phrases[currentPhrase];
            const gameContent = document.getElementById('gameContent');
            gameContent.innerHTML = '';

            // Criar seção da frase
            const phraseSection = document.createElement('div');
            phraseSection.className = 'phrase-section';

            const phraseLabel = document.createElement('div');
            phraseLabel.className = 'phrase-label';
            phraseLabel.textContent = `Frase ${currentPhrase + 1} de ${phrases.length}`;
            phraseSection.appendChild(phraseLabel);

            const phraseDiv = document.createElement('div');
            phraseDiv.className = 'phrase';

            let textParts = phrase.phrase.split('');
            let blankIndex = 0;

            let currentText = '';
            for (let i = 0; i < textParts.length; i++) {
                if (textParts[i] === '█') {
                    if (currentText) {
                        const span = document.createElement('span');
                        span.textContent = currentText;
                        phraseDiv.appendChild(span);
                        currentText = '';
                    }

                    const blank = document.createElement('div');
                    blank.className = 'word-blank';
                    blank.id = `blank-${blankIndex}`;
                    blank.ondrop = drop;
                    blank.ondragover = allowDrop;
                    blank.ondragleave = dragLeave;
                    blank.textContent = '?';
                    phraseDiv.appendChild(blank);
                    blankIndex++;
                } else {
                    currentText += textParts[i];
                }
            }

            if (currentText) {
                const span = document.createElement('span');
                span.textContent = currentText;
                phraseDiv.appendChild(span);
            }

            // Se a frase não tem █, criar um blank genérico após o texto
            if (blankIndex === 0) {
                const blank = document.createElement('div');
                blank.className = 'word-blank';
                blank.id = 'blank-0';
                blank.ondrop = drop;
                blank.ondragover = allowDrop;
                blank.ondragleave = dragLeave;
                blank.textContent = '?';
                phraseDiv.appendChild(blank);
            }

            phraseSection.appendChild(phraseDiv);
            gameContent.appendChild(phraseSection);

            // Criar banco de palavras
            const wordBankLabel = document.createElement('div');
            wordBankLabel.className = 'word-bank-label';
            wordBankLabel.textContent = 'Palavras Disponíveis';
            gameContent.appendChild(wordBankLabel);

            const wordBank = document.createElement('div');
            wordBank.className = 'word-bank';
            wordBank.id = 'wordBank';

            // Embaralhar opções
            const shuffledOptions = [...phrase.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((word, index) => {
                const wordDiv = document.createElement('div');
                wordDiv.className = 'draggable-word';
                wordDiv.draggable = true;
                wordDiv.textContent = word;
                wordDiv.id = `word-${index}`;
                wordDiv.ondragstart = dragStart;
                wordDiv.ondragend = dragEnd;
                wordBank.appendChild(wordDiv);

                if (usedWords.has(word)) {
                    wordDiv.classList.add('used');
                }
            });

            gameContent.appendChild(wordBank);

            // Restaurar palavras preenchidas
            phrase.blanks.forEach((_, idx) => {
                if (filledBlanks[currentPhrase] && filledBlanks[currentPhrase][idx]) {
                    const blank = document.getElementById(`blank-${idx}`);
                    const word = filledBlanks[currentPhrase][idx];
                    blank.textContent = word;
                    blank.classList.add('filled');
                }
            });

            updateProgress();
        }

        function dragStart(e) {
            if (this.classList.contains('used')) return;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.textContent);
            this.classList.add('dragging');
        }

        function dragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.word-blank').forEach(blank => {
                blank.classList.remove('drop-zone-active');
            });
        }

        function allowDrop(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drop-zone-active');
        }

        function dragLeave(e) {
            this.classList.remove('drop-zone-active');
        }

        function drop(e) {
            e.preventDefault();
            this.classList.remove('drop-zone-active');

            const word = e.dataTransfer.getData('text/plain');
            const blankId = this.id;
            const blankIndex = parseInt(blankId.split('-')[1]);

            // Remover palavra anterior se existia
            if (this.textContent !== '?') {
                const oldWord = this.textContent;
                document.querySelectorAll('.draggable-word').forEach(w => {
                    if (w.textContent === oldWord) {
                        w.classList.remove('used');
                    }
                });
            }

            // Adicionar nova palavra
            this.textContent = word;
            this.classList.add('filled');

            // Marcar palavra como usada
            document.querySelectorAll('.draggable-word').forEach(w => {
                if (w.textContent === word) {
                    w.classList.add('used');
                }
            });

            // Armazenar resposta
            if (!filledBlanks[currentPhrase]) {
                filledBlanks[currentPhrase] = {};
            }
            filledBlanks[currentPhrase][blankIndex] = word;
        }

        function checkAnswers() {
            const phrase = phrases[currentPhrase];
            const blanks = document.querySelectorAll('.word-blank');
            let allCorrect = true;

            blanks.forEach((blank, index) => {
                if (blank.textContent !== phrase.blanks[index]) {
                    allCorrect = false;
                }
            });

            const feedback = document.getElementById('feedback');

            if (allCorrect) {
                feedback.className = 'feedback success';
                feedback.textContent = '✓ Correto! Parabéns!';
                correctAnswers++;
                document.getElementById('correct').textContent = correctAnswers;

                setTimeout(() => {
                    if (currentPhrase < phrases.length - 1) {
                        currentPhrase++;
                        filledBlanks = {};
                        usedWords.clear();
                        loadPhrase();
                        feedback.className = 'feedback';
                    } else {
                        feedback.textContent = `🎉 Você completou todas as frases! Acertou ${correctAnswers} de ${phrases.length}!`;
                    }
                }, 1500);
            } else {
                feedback.className = 'feedback error';
                feedback.textContent = '✗ Incorreto! Tente novamente.';
            }
        }

        function resetGame() {
            currentPhrase = 0;
            correctAnswers = 0;
            filledBlanks = {};
            usedWords.clear();
            document.getElementById('correct').textContent = '0';
            document.getElementById('feedback').className = 'feedback';
            loadPhrase();
        }

        function updateProgress() {
            const progress = ((currentPhrase + 1) / phrases.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('level').textContent = currentPhrase + 1;
        }

        // Inicializar
        loadPhrase();
    </script>
</body>
</html>
